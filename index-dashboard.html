<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Riesgos · SIG Ecosocial</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* Paleta portada SIGP: lima → verde profundo */
  --lima: #B4D445;
  --lima-soft: rgba(180, 212, 69, 0.18);
  --lima-glow: rgba(180, 212, 69, 0.35);
  --deep: #135242;
  --deep-2: #0d3d32;
  --deep-3: #0a2e26;
  --grad-portada: linear-gradient(135deg, #B4D445 0%, #135242 100%);
  --grad-portada-soft: linear-gradient(135deg, rgba(180,212,69,0.25) 0%, rgba(19,82,66,0.45) 100%);
  --negro: #111111;
  --card: rgba(255, 255, 255, 0.97);
  --borde: rgba(19, 82, 66, 0.14);
  --texto: #0f1a16;
  --muted: #5a6b63;
  --rojo: #e05a48;
  --naranja: #e8913f;
  --azul: #3a9fd4;
  --violeta: #8b75e0;
  --verde: #135242;
  --panel-bg: rgba(244, 247, 245, 0.92);
  --shadow-sm: 0 1px 2px rgba(19, 82, 66, 0.06), 0 1px 3px rgba(19, 82, 66, 0.05);
  --shadow-md: 0 4px 18px rgba(19, 82, 66, 0.1), 0 1px 3px rgba(19, 82, 66, 0.05);
  --shadow-lg: 0 12px 40px rgba(19, 82, 66, 0.14);
  --radius: 14px;
  --radius-sm: 10px;
}

#video-fondo {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover; z-index: -1000;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  color: var(--texto);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background:
    linear-gradient(135deg, rgba(180, 212, 69, 0.12) 0%, transparent 42%),
    linear-gradient(165deg, rgba(10, 46, 38, 0.92) 0%, rgba(19, 82, 66, 0.78) 45%, rgba(8, 22, 18, 0.94) 100%);
  z-index: -999;
}

/* ========== HEADER ========== */
header {
  background:
    radial-gradient(ellipse 80% 120% at 10% 0%, rgba(180,212,69,0.35) 0%, transparent 55%),
    radial-gradient(ellipse 60% 100% at 90% 100%, rgba(19,82,66,0.5) 0%, transparent 50%),
    linear-gradient(135deg, #B4D445 0%, #6a9a3a 28%, #135242 72%, #0d3d32 100%);
  border-bottom: 3px solid #B4D445;
  padding: 12px 22px;
  min-height: 118px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky; top: 0; z-index: 300;
  box-shadow: 0 6px 32px rgba(19, 82, 66, 0.4), inset 0 -1px 0 rgba(255,255,255,0.12);
  overflow: visible;
}

.h-title {
  font-size: 15px; font-weight: 800; color: #fff;
  text-transform: uppercase; letter-spacing: 1.4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  position: relative;
}
.h-title::after {
  content: '';
  display: block;
  width: 48px; height: 3px;
  margin: 6px auto 0;
  border-radius: 3px;
  background: linear-gradient(90deg, transparent, #B4D445, transparent);
}
.h-sub {
  font-size: 10px; color: #f0f7c8; margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.9px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  opacity: 0.95;
}

.logo-img {
  height: 96px;
  width: auto;
  max-width: 240px;
  transform: scale(1.55);
  transform-origin: center center;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
  flex-shrink: 0;
  object-fit: contain;
  display: block;
  transition: transform 0.25s ease;
}
.logo-img:hover { transform: scale(1.62); }
.header-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 200px;
  min-height: 110px;
  flex-shrink: 0;
  overflow: visible;
}
.header-center {
  flex: 1;
  text-align: center;
  min-width: 0;
  padding: 0 8px;
}

/* ========== STATUS ========== */
#statusbar {
  background: linear-gradient(180deg, #ffffff 0%, #f7faf6 100%);
  border-bottom: 1px solid rgba(19,82,66,0.1);
  padding: 10px 28px;
  display: flex; align-items: center; gap: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #0d3d32;
  font-weight: 600;
  letter-spacing: 0.25px;
  box-shadow: 0 2px 8px rgba(19,82,66,0.04);
}
#statusbar #stxt {
  color: #0d3d32;
  font-weight: 600;
}
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #9aa89f; flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}
.dot.ok {
  background: #B4D445;
  box-shadow: 0 0 0 3px rgba(180,212,69,0.35), 0 0 10px rgba(180,212,69,0.5);
  animation: blink 2s infinite;
}
.dot.err {
  background: var(--rojo);
  box-shadow: 0 0 0 3px rgba(224,90,72,0.25), 0 0 8px rgba(224,90,72,0.35);
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.45} }

/* ========== SEGMENTOS ========== */
.segmentos-bar {
  display: flex; gap: 10px;
  background: linear-gradient(90deg, rgba(180,212,69,0.2) 0%, rgba(19,82,66,0.12) 50%, rgba(180,212,69,0.15) 100%);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid #B4D445;
  padding: 10px 16px;
  overflow-x: auto;
}

.seg-btn {
  flex: 1; min-width: 170px;
  background: rgba(255,255,255,0.92);
  border: 1px solid rgba(19,82,66,0.12);
  border-radius: 14px;
  padding: 12px 14px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.45px;
  color: #135242;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 8px rgba(19,82,66,0.06);
  position: relative;
  overflow: hidden;
}
.seg-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(180,212,69,0.2), transparent 60%);
  opacity: 0;
  transition: opacity 0.22s ease;
}
.seg-btn:hover {
  color: #0d3d32;
  background: #fff;
  border-color: #B4D445;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(19,82,66,0.12);
}
.seg-btn:hover::before { opacity: 1; }
.seg-btn.activo {
  color: #0d3d32;
  background: linear-gradient(135deg, rgba(180,212,69,0.4) 0%, rgba(255,255,255,0.95) 55%, rgba(19,82,66,0.08) 100%);
  border-color: #B4D445;
  box-shadow: 0 0 0 3px rgba(180,212,69,0.28), 0 4px 16px rgba(19,82,66,0.12);
  font-weight: 800;
}
.seg-btn .seg-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700;
  background: rgba(180,212,69,0.22);
  color: #135242;
  padding: 3px 9px; border-radius: 20px;
}
.seg-btn.activo .seg-badge {
  background: linear-gradient(135deg, #B4D445, #8fb82e);
  color: #135242;
  box-shadow: 0 2px 6px rgba(180,212,69,0.35);
}
.seg-btn[data-seg="reportados"] .seg-badge { background: rgba(224,90,72,0.12); color: var(--rojo); }
.seg-btn[data-seg="reportados"].activo {
  border-color: rgba(224,90,72,0.5);
  box-shadow: 0 0 0 3px rgba(224,90,72,0.12), var(--shadow-md);
}
.seg-btn[data-seg="reportados"].activo .seg-badge { background: var(--rojo); color: #fff; }
.seg-btn[data-seg="solucionados"] .seg-badge { background: rgba(36,154,95,0.12); color: var(--verde); }
.seg-btn[data-seg="solucionados"].activo {
  border-color: rgba(36,154,95,0.45);
  box-shadow: 0 0 0 3px rgba(36,154,95,0.12), var(--shadow-md);
}
.seg-btn[data-seg="solucionados"].activo .seg-badge { background: var(--verde); color: #fff; }

/* ========== LAYOUT ========== */
.layout {
  display: flex;
  height: calc(100vh - 175px);
  overflow: hidden;
  background: transparent;
}

.panel-iconos {
  width: 318px; flex-shrink: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(245,250,235,0.96) 35%, rgba(240,247,242,0.97) 100%);
  backdrop-filter: blur(14px);
  border-right: 2px solid rgba(180,212,69,0.4);
  overflow-y: auto; padding: 14px 12px;
  box-shadow: 6px 0 28px rgba(19,82,66,0.1);
}
.panel-iconos::-webkit-scrollbar { width: 5px; }
.panel-iconos::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #B4D445, #135242);
  border-radius: 10px;
}

.cat-bloque { margin-bottom: 8px; }
.cat-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(145deg, #ffffff 0%, #f6faef 100%);
  border: 1px solid rgba(180,212,69,0.28);
  transition: all 0.22s ease; user-select: none; margin-bottom: 2px;
  box-shadow: 0 2px 8px rgba(19,82,66,0.05);
  color: #135242;
}
.cat-header:hover {
  border-color: #B4D445;
  background: linear-gradient(135deg, rgba(180,212,69,0.28) 0%, #fff 65%);
  color: #0d3d32;
  transform: translateX(2px);
  box-shadow: 0 4px 14px rgba(19,82,66,0.1);
}
.cat-header.abierto {
  border-color: #B4D445;
  background: linear-gradient(135deg, rgba(180,212,69,0.28) 0%, rgba(255,255,255,0.98) 55%);
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
  box-shadow: 0 0 0 2px rgba(180,212,69,0.22), 0 4px 12px rgba(19,82,66,0.08);
}
.cat-emoji {
  font-size: 18px;
  width: 28px; text-align: center;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));
}
.cat-nombre { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; flex: 1; }
.cat-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  background: linear-gradient(135deg, #B4D445, #8fb82e);
  color: #135242 !important;
  padding: 3px 10px; border-radius: 20px;
  box-shadow: 0 2px 6px rgba(180,212,69,0.35);
}
.cat-arrow { font-size: 10px; color: var(--muted); transition: transform .25s ease; }
.cat-header.abierto .cat-arrow { transform: rotate(90deg); color: var(--deep-2); }

.cat-iconos {
  display: none; flex-direction: column; gap: 3px;
  background: linear-gradient(180deg, rgba(180,212,69,0.1), rgba(255,255,255,0.98));
  border: 1px solid #B4D445;
  border-top: none;
  border-radius: 0 0 12px 12px;
  padding: 8px 6px;
  animation: fadeSlide 0.22s ease;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.cat-iconos.visible { display: flex; }

.icono-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 11px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; transition: all .18s ease; background: transparent;
}
.icono-item:hover {
  background: #fff;
  border-color: rgba(180,212,69,0.35);
  box-shadow: 0 2px 10px rgba(19,82,66,0.07);
  transform: translateX(3px);
}
.icono-item.activo {
  background: linear-gradient(90deg, rgba(180,212,69,0.32) 0%, rgba(180,212,69,0.08) 100%);
  border-color: #B4D445;
  box-shadow: inset 4px 0 0 #B4D445, 0 2px 8px rgba(180,212,69,0.15);
}
.icono-emoji {
  font-size: 16px; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; flex-shrink: 0; letter-spacing: -2px;
  background: rgba(180,212,69,0.12);
  border-radius: 10px;
}
.icono-item.activo .icono-emoji {
  background: linear-gradient(135deg, rgba(180,212,69,0.45), rgba(19,82,66,0.12));
}
.icono-label { font-size: 11px; color: #135242; flex: 1; line-height: 1.35; font-weight: 600; }
.icono-item.activo .icono-label { color: #0d3d32; font-weight: 700; }
.icono-total {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  color: #135242; background: linear-gradient(135deg, rgba(180,212,69,0.5), rgba(180,212,69,0.22));
  padding: 3px 8px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  border: 1px solid rgba(180,212,69,0.35);
}
.icono-total.cero { color: #8a9a90; background: transparent; border-color: transparent; }
.icono-pct { font-weight: 400; opacity: .7; font-size: 9px; }

.panel-grafica {
  flex: 1; overflow-y: auto;
  padding: 20px 24px;
  display: flex; flex-direction: column; gap: 16px;
  background: transparent;
}
.panel-grafica::-webkit-scrollbar { width: 6px; }
.panel-grafica::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }

.estado-vacio {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  color: rgba(255,255,255,0.7); text-align: center; padding: 48px;
  background: rgba(255,255,255,0.06);
  border: 1px dashed rgba(255,255,255,0.15);
  border-radius: var(--radius);
  backdrop-filter: blur(6px);
}
.estado-vacio .big-emoji { font-size: 56px; opacity: .35; }
.estado-vacio h3 { font-size: 17px; color: #B4D445; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.estado-vacio p { font-size: 12px; line-height: 1.7; max-width: 340px; color: rgba(240,247,200,0.75); }

.grafica-header {
  background:
    radial-gradient(ellipse 70% 120% at 0% 50%, rgba(255,255,255,0.18) 0%, transparent 50%),
    linear-gradient(135deg, #B4D445 0%, #7aaa38 40%, #135242 100%);
  border: none;
  border-radius: 16px;
  padding: 18px 22px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: 0 8px 28px rgba(19, 82, 66, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  position: relative;
  overflow: visible;
  min-height: auto;
}
/* sin línea lateral */
.grafica-header::before { display: none !important; content: none !important; }
.grafica-emoji-big {
  font-size: 36px;
  flex-shrink: 0;
  line-height: 1;
  margin-top: 2px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.grafica-header > div:not(.grafica-kpis):not(.grafica-emoji-big) {
  flex: 1 1 200px;
  min-width: 0;
}
.grafica-titulo {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.2px;
  line-height: 1.3;
  white-space: normal;
  word-break: break-word;
  overflow: visible;
  max-width: 100%;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}
.grafica-subtitulo {
  font-size: 10px;
  color: rgba(240, 247, 200, 0.9);
  margin-top: 5px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.3px;
  white-space: normal;
  word-break: break-word;
  line-height: 1.4;
}
.grafica-kpis {
  display: flex; gap: 10px;
  margin-left: auto;
  flex-shrink: 0;
  flex-wrap: wrap;
  align-items: stretch;
}
.kpi-mini {
  text-align: center;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 14px;
  padding: 9px 14px;
  min-width: 76px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
  backdrop-filter: blur(4px);
}
.kpi-mini-n {
  font-size: 24px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.15;
  color: #135242 !important;
}
.kpi-mini-l {
  font-size: 8px;
  color: #4a6a40;
  text-transform: uppercase;
  letter-spacing: 1.1px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 4px;
  font-weight: 600;
}

.card {
  background: linear-gradient(180deg, #ffffff 0%, #fafcf8 100%);
  border: 1px solid rgba(180,212,69,0.3);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 4px 20px rgba(19,82,66,0.08), 0 1px 3px rgba(19,82,66,0.04);
  transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  overflow: visible;
  animation: cardIn 0.35s ease both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.card:hover {
  box-shadow: 0 12px 36px rgba(19,82,66,0.14), 0 2px 6px rgba(19,82,66,0.06);
  border-color: rgba(180,212,69,0.65);
  transform: translateY(-2px);
}
.card-hd { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.card-title {
  font-size: 12px; font-weight: 800; color: #135242;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.card-sub {
  font-size: 9px; color: #5a7a4a; margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}
.badge {
  background: linear-gradient(135deg, rgba(180,212,69,0.35), rgba(19,82,66,0.12));
  border: 1px solid rgba(180,212,69,0.55);
  color: #135242;
  font-size: 8px; font-weight: 800;
  padding: 4px 10px; border-radius: 20px;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 1.1px;
  box-shadow: 0 1px 4px rgba(180,212,69,0.2);
}
.chart-box { position: relative; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
thead th {
  background: linear-gradient(135deg, #B4D445 0%, #7aaa38 40%, #135242 100%);
  color: #ffffff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 11px 12px; text-align: left;
  border-bottom: none;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
thead th:first-child { border-radius: 10px 0 0 0; }
thead th:last-child { border-radius: 0 10px 0 0; }
tbody td {
  padding: 10px 11px;
  border-bottom: 1px solid rgba(19,82,66,0.08);
  vertical-align: middle; color: #135242;
}
tbody tr:hover td { background: rgba(180,212,69,0.12); color: #0d3d32; }
.rank { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 10px; }
.bar-mini { height: 4px; background: #e8ede9; border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; }
.num-bold { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; }

.loader-full {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 200px; gap: 12px; color: var(--muted);
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
}
.spinner {
  width: 30px; height: 30px;
  border: 2.5px solid rgba(180,212,69,0.25);
  border-top-color: #B4D445;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.footer-ts {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: rgba(180,212,69,0.65);
  text-align: center; padding: 8px 0 20px;
}

.seg-info {
  background: linear-gradient(135deg, rgba(180,212,69,0.22) 0%, rgba(19,82,66,0.06) 100%);
  border: 1px solid rgba(180,212,69,0.4);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 10px; color: #4a5c54; line-height: 1.55;
  box-shadow: 0 2px 8px rgba(19,82,66,0.05);
}

/* Lista reportes */
.lista-reportes { display: flex; flex-direction: column; gap: 10px; max-height: 440px; overflow-y: auto; }
.lista-reportes::-webkit-scrollbar { width: 5px; }
.lista-reportes::-webkit-scrollbar-thumb { background: rgba(19,82,66,0.2); border-radius: 10px; }

.card-reporte {
  border: 1px solid rgba(19,82,66,0.1);
  border-radius: 12px;

const OPCIONES_POSTE_DASH = [
  'Corrosión Severa en la Base',
  'Inclinación del Poste',
  'Poste Energizado o Fuga a Tierra',
  'Crucetas o Brazos Deformados',

let DETALLE_ESPECIFICACIONES = {};

function colorAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function cortar(str, n = 30) {
  str = String(str || '');
  return str.length > n ? str.slice(0,n)+'…' : str;
}

function parsearGeoJSON(geo) {
  const c = {};
  if (!geo?.features) return c;
  geo.features.forEach(f => {
    const tid = f.properties?.tipoId;
    if (tid) c[tid] = (c[tid]||0) + 1;
  });
  return c;
}

/** Extrae texto de especificación de un feature del mapa */
function extraerEspecificacionFeature(f) {
  const p = f.properties || {};
  const raw = (p.especificacion || p.especificacionDiscapacidad || '').trim();
  return raw;
}

/** Normaliza etiqueta de poste para agrupar */
function normalizarEspecPoste(texto) {
  const t = (texto || '').trim();
  if (!t) return '(Sin especificar)';
  for (const op of OPCIONES_POSTE_DASH) {
    if (op !== 'Otro' && t.toLowerCase() === op.toLowerCase()) return op;
  }
  if (t.toLowerCase() === 'otro') return 'Otro';
  if (t.toLowerCase().startsWith('otro:')) {
    const rest = t.slice(5).trim();
    return rest ? ('Otro: ' + rest) : 'Otro';
  }
  // Si no coincide con opciones conocidas, mostrar el texto tal cual
  return t;
}

function registrarEspecificacion(tipoId, texto) {
  if (!tipoId) return;
  if (!DETALLE_ESPECIFICACIONES[tipoId]) DETALLE_ESPECIFICACIONES[tipoId] = {};
  const key = tipoId === 'poste_riesgo' ? normalizarEspecPoste(texto) : ((texto || '').trim() || '(Sin especificar)');
  DETALLE_ESPECIFICACIONES[tipoId][key] = (DETALLE_ESPECIFICACIONES[tipoId][key] || 0) + 1;
}

/** Recorre geometría y acumula especificaciones de postes / discapacidades / animales */
function acumularEspecificacionesDesdeGeo(geo) {
  if (!geo || !Array.isArray(geo.features)) return;
  geo.features.forEach(f => {
    const tid = f.properties && f.properties.tipoId;
    if (!tid || !TIPOS_CON_ESPECIFICACION.includes(tid)) return;
    registrarEspecificacion(tid, extraerEspecificacionFeature(f));
  });
}

function esSolucionado(estado) {
  if (!estado) return false;
  const e = String(estado).toLowerCase().trim();
  return e === 'atendido' || e === 'solucionado' || e === 'resuelto' || e === 'cerrado';
}

/** Emoji del tipo de riesgo según CATEGORIAS (por label exacto o parcial) */
function emojiDeTipoRiesgo(tipoLabel) {
  const t = String(tipoLabel || '').trim().toLowerCase();
  if (!t) return '⚠️';
  for (const cat of CATEGORIAS) {
    for (const ic of cat.iconos) {
      const lab = String(ic.label || '').toLowerCase();
      if (lab === t || lab.includes(t) || t.includes(lab)) return ic.emoji;
    }
  }
  // aliases frecuentes si el texto del reporte no coincide exacto
  if (t.includes('basura') || t.includes('vertedero')) return '🗑️';
  if (t.includes('inund')) return '🌊';
  if (t.includes('derrumbe')) return '🚧';
  if (t.includes('poste') || t.includes('eléctrico')) return '⚡';
  if (t.includes('árbol') || t.includes('arbol')) return '🌳';
  if (t.includes('vivienda') || t.includes('casa')) return '🏚️';
  if (t.includes('agua potable') || t.includes('fuga')) return '💧';
  if (t.includes('servidas') || t.includes('cloaca') || t.includes('colector')) return '☣️';
  if (t.includes('neumático') || t.includes('cauchera')) return '🚗';
  if (t.includes('pozo')) return '🕳️';
  if (t.includes('incendio')) return '🔥';
  if (t.includes('alta tensión') || t.includes('alta tension')) return '🗼';
  if (t.includes('tubería matriz') || t.includes('tuberia matriz')) return '💦';
  if (t.includes('gasoducto') || t.includes('poliducto')) return '🛢️';
  if (t.includes('talud')) return '🪨';
  if (t.includes('humedal')) return '🏞️';
  if (t.includes('corrosión') || t.includes('corrosion') || t.includes('inclinación') || t.includes('inclinacion') || t.includes('cruceta') || t.includes('transformador') || t.includes('fuga a tierra') || t.includes('conexiones ilegales')) return '⚡';
  if (t.includes('discapacidad')) return '♿';
  return '⚠️';
}

async function cargarTodo() {
  setStatus('Cargando datos de Supabase...', 'ok');
  try {
    // 1) Elementos del mapa (geometría)
    const { data: mapas, error: errMapas } = await _sb
      .from('mapas_comunales')
      .select('id_comuna, geometria_mapa');

    if (errMapas) throw errMapas;

    DATOS_ELEMENTOS = {};
    DETALLE_ESPECIFICACIONES = {};
    (mapas || []).forEach(row => {
      const com = row.id_comuna;
      if (!com) return;
      if (!DATOS_ELEMENTOS[com]) DATOS_ELEMENTOS[com] = {};
      const parcial = parsearGeoJSON(row.geometria_mapa);
      Object.entries(parcial).forEach(([tid, cnt]) => {
        DATOS_ELEMENTOS[com][tid] = (DATOS_ELEMENTOS[com][tid]||0) + cnt;
      });
      acumularEspecificacionesDesdeGeo(row.geometria_mapa);
    });

    TOTALES_ELEMENTOS = {};
    Object.values(DATOS_ELEMENTOS).forEach(com => {
      Object.entries(com).forEach(([tid, cnt]) => {
        TOTALES_ELEMENTOS[tid] = (TOTALES_ELEMENTOS[tid]||0) + cnt;
      });
    });

    // 2) Reportes (riesgos reportados y solucionados)
    const { data: reportes, error: errRep } = await _sb
      .from('reportes_riesgos')
      .select('id, numero_reporte, tipo_riesgo, nivel_urgencia, comuna, sector, coordenadas, referencia, detalle, texto_completo, usuario_email, empadronador, telefono, layer_stamp, estado, created_at, enviado_at')
      .order('created_at', { ascending: false });

    if (errRep) {
      console.warn('Tabla reportes_riesgos:', errRep.message);
      setStatus('Elementos OK · Reportes: ' + errRep.message, 'err');
    }

    REPORTES_FULL = reportes || [];

    // Completar empadronador/teléfono desde registross_voceros si faltan
    try {
      const correos = [...new Set(REPORTES_FULL.map(r => r.usuario_email).filter(Boolean))];
      if (correos.length) {
        const { data: voceros } = await _sb.from('registross_voceros').select('*');
        const mapaVoc = {};
        (voceros || []).forEach(v => {
          const c = (v.correo || '').toLowerCase();
          if (c) mapaVoc[c] = v;
        });
        REPORTES_FULL.forEach(r => {
          const c = (r.usuario_email || '').toLowerCase();
          const v = mapaVoc[c];
          if (v) {
            if (!r.empadronador) r.empadronador = ((v.nombres || '') + ' ' + (v.apellidos || '')).trim();
            if (!r.telefono) r.telefono = v.telefono || '';
          }
        });
      }
    } catch (eVoc) {
      console.warn('Lookup voceros:', eVoc);
    }

    DATOS_REPORTADOS = {};
    DATOS_SOLUCIONADOS = {};
    TOTALES_REPORTADOS = {};
    TOTALES_SOLUCIONADOS = {};
    const setTiposRep = new Set();
    const setTiposSol = new Set();

    REPORTES_FULL.forEach(r => {
      const tipo = (r.tipo_riesgo || 'Sin tipo').trim();
      const com = (r.comuna || 'Sin comuna').trim();
      if (esSolucionado(r.estado)) {
        if (!DATOS_SOLUCIONADOS[com]) DATOS_SOLUCIONADOS[com] = {};
        DATOS_SOLUCIONADOS[com][tipo] = (DATOS_SOLUCIONADOS[com][tipo]||0) + 1;
        TOTALES_SOLUCIONADOS[tipo] = (TOTALES_SOLUCIONADOS[tipo]||0) + 1;
        setTiposSol.add(tipo);
      } else {
        if (!DATOS_REPORTADOS[com]) DATOS_REPORTADOS[com] = {};
        DATOS_REPORTADOS[com][tipo] = (DATOS_REPORTADOS[com][tipo]||0) + 1;
        TOTALES_REPORTADOS[tipo] = (TOTALES_REPORTADOS[tipo]||0) + 1;
        setTiposRep.add(tipo);
      }
    });

    LISTA_TIPOS_REPORTADOS = Array.from(setTiposRep).sort((a,b) =>
      (TOTALES_REPORTADOS[b]||0) - (TOTALES_REPORTADOS[a]||0)
    );
    LISTA_TIPOS_SOLUCIONADOS = Array.from(setTiposSol).sort((a,b) =>
      (TOTALES_SOLUCIONADOS[b]||0) - (TOTALES_SOLUCIONADOS[a]||0)
    );

    const nElem = Object.values(TOTALES_ELEMENTOS).reduce((s,v)=>s+v,0);
    const nRep = Object.values(TOTALES_REPORTADOS).reduce((s,v)=>s+v,0);
    const nSol = Object.values(TOTALES_SOLUCIONADOS).reduce((s,v)=>s+v,0);

    document.getElementById('badge-elementos').textContent = nElem;
    document.getElementById('badge-reportados').textContent = nRep;
    document.getElementById('badge-solucionados').textContent = nSol;

    setStatus(`✓ ${nElem} elementos · ${nRep} reportados · ${nSol} solucionados`, 'ok');
    construirPanel();

  } catch (err) {
    setStatus('Error: ' + err.message, 'err');
    console.error(err);
  }
}

function cambiarSegmento(seg) {
  segmentoActivo = seg;
  document.querySelectorAll('.seg-btn').forEach(b => {
    b.classList.toggle('activo', b.dataset.seg === seg);
  });
  if (chartBarras) { chartBarras.destroy(); chartBarras = null; }
  if (chartDona) { chartDona.destroy(); chartDona = null; }
  document.getElementById('panel-grafica').innerHTML = `
    <div class="estado-vacio">
      <div class="big-emoji">👈</div>
      <h3>Selecciona un indicador</h3>
      <p>Haz clic en un ítem del panel izquierdo para ver las gráficas de este segmento.</p>
    </div>`;
  construirPanel();
}

function construirPanel() {
  const panel = document.getElementById('panel-iconos');
  panel.innerHTML = '';

  if (segmentoActivo === 'elementos') {
    panel.innerHTML = `<div class="seg-info">📍 Contadores de íconos colocados en los mapas comunales (geometría de <b>mapas_comunales</b>).</div>`;
    construirPanelElementos(panel);
  } else if (segmentoActivo === 'reportados') {
    panel.innerHTML = `<div class="seg-info">📢 Reportes enviados a Telegram (aún no atendidos).</div>
      <div class="busca-global-bar">
        <div class="busca-reporte-wrap" style="max-width:100%;width:100%;">
          <span class="lupa">🔍</span>
          <input type="text" id="busca-global-codigo" placeholder="Código #REP-... y Enter" style="width:100%;" autocomplete="off">
        </div>
      </div>`;
    const inpG = panel.querySelector('#busca-global-codigo');
    if (inpG) inpG.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') buscarReportePorCodigo(inpG.value.trim(), 'reportados');
    });
    construirPanelReportes(panel, LISTA_TIPOS_REPORTADOS, TOTALES_REPORTADOS, '#e85c4a', 'reportados');
  } else {
    panel.innerHTML = `<div class="seg-info">✅ Reportes marcados como solucionados/atendidos.</div>
      <div class="busca-global-bar">
        <div class="busca-reporte-wrap" style="max-width:100%;width:100%;">
          <span class="lupa">🔍</span>
          <input type="text" id="busca-global-codigo" placeholder="Código #REP-... y Enter" style="width:100%;" autocomplete="off">
        </div>
      </div>`;
    const inpG2 = panel.querySelector('#busca-global-codigo');
    if (inpG2) inpG2.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') buscarReportePorCodigo(inpG2.value.trim(), 'solucionados');
    });
    construirPanelReportes(panel, LISTA_TIPOS_SOLUCIONADOS, TOTALES_SOLUCIONADOS, '#2ea86a', 'solucionados');
  }
}

function buscarReportePorCodigo(codigo, modo) {
  if (!codigo) return;
  const q = codigo.toLowerCase().replace(/\s/g, '');
  const lista = REPORTES_FULL.filter(r => {
    const sol = esSolucionado(r.estado);
    if (modo === 'solucionados' ? !sol : sol) return false;
    const num = String(r.numero_reporte || '').toLowerCase().replace(/\s/g, '');
    const id = String(r.id || '');
    return num.includes(q) || num.replace(/#/g,'').includes(q.replace(/#/g,'')) || id === q;
  });
  if (!lista.length) {
    document.getElementById('panel-grafica').innerHTML = `
      <div class="estado-vacio">
        <div class="big-emoji">🔍</div>
        <h3>Sin resultados</h3>
        <p>No hay reportes con el código <b>${codigo}</b> en este segmento.</p>
      </div>`;
    return;
  }
  const tipo = (lista[0].tipo_riesgo || 'Sin tipo').trim();
  const color = modo === 'solucionados' ? '#2ea86a' : '#e85c4a';
  const fuenteDatos = modo === 'solucionados' ? DATOS_SOLUCIONADOS : DATOS_REPORTADOS;
  const porComuna = {};
  Object.entries(fuenteDatos).forEach(([com, ind]) => {
    if (ind[tipo]) porComuna[com] = ind[tipo];
  });
  tipoSeleccionadoActual = tipo;
  modoSeleccionadoActual = modo;
  const emojiRiesgo = emojiDeTipoRiesgo(tipo);
  renderGraficas({
    emoji: emojiRiesgo + (modo === 'solucionados' ? '✅' : '📢'),
    titulo: tipo,
    subtitulo: 'Búsqueda · ' + codigo,
    color,
    porComuna,
    fuente: 'búsqueda: ' + codigo,
    listaReportes: lista,
    modoLista: modo
  });
  setTimeout(() => {
    const inp = document.getElementById('input-busca-reporte');
    if (inp) { inp.value = codigo; inp.dispatchEvent(new Event('input')); inp.focus(); }
  }, 80);
}

function construirPanelElementos(panel) {
  CATEGORIAS.forEach((cat, ci) => {
    const iconosOrdenados = cat.iconos
      .map(ic => ({ ...ic, total: TOTALES_ELEMENTOS[ic.id] || 0 }))
      .sort((a, b) => b.total - a.total);

    const totalCat = iconosOrdenados.reduce((s, ic) => s + ic.total, 0);

    const bloque = document.createElement('div');
    bloque.className = 'cat-bloque';

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <span class="cat-emoji">${cat.emoji}</span>
      <span class="cat-nombre" style="color:${cat.color}">${cat.nombre}</span>
      <span class="cat-count" style="color:${cat.color}">${totalCat}</span>
      <span class="cat-arrow">▶</span>`;

    const contIconos = document.createElement('div');
    contIconos.className = 'cat-iconos';

    iconosOrdenados.forEach(icono => {
      const total = icono.total;
      const pct = totalCat > 0 ? Math.round((total / totalCat) * 100) : 0;
      const item = document.createElement('div');
      item.className = 'icono-item';
      item.innerHTML = `
        <span class="icono-emoji">${icono.emoji}</span>
        <span class="icono-label">${icono.label}</span>
        <span class="icono-total ${total===0?'cero':''}">${total}${total>0?` <span class="icono-pct">(${pct}%)</span>`:''}</span>`;
      item.addEventListener('click', () => mostrarGraficaElemento(icono, cat, item));
      contIconos.appendChild(item);
    });

    header.addEventListener('click', () => {
      const estaAbierto = header.classList.contains('abierto');
      document.querySelectorAll('.cat-header').forEach(h => h.classList.remove('abierto'));
      document.querySelectorAll('.cat-iconos').forEach(c => c.classList.remove('visible'));
      if (!estaAbierto) {
        header.classList.add('abierto');
        contIconos.classList.add('visible');
      }
    });

    bloque.appendChild(header);
    bloque.appendChild(contIconos);
    panel.appendChild(bloque);

    if (ci === 0) {
      header.classList.add('abierto');
      contIconos.classList.add('visible');
    }
  });
}

function construirPanelReportes(panel, listaTipos, totales, color, modo) {
  if (!listaTipos.length) {
    const vacio = document.createElement('div');
    vacio.className = 'estado-vacio';
    vacio.style.minHeight = '180px';
    vacio.innerHTML = `
      <div class="big-emoji">${modo === 'solucionados' ? '✅' : '📢'}</div>
      <h3>Sin registros aún</h3>
      <p>${modo === 'solucionados'
        ? 'Cuando marques un reporte como Atendido y se guarde en Supabase con estado “atendido”, aparecerá aquí.'
        : 'Cuando envíes reportes desde el mapa (botón REPORTAR), aparecerán aquí agrupados por tipo de riesgo.'}</p>`;
    panel.appendChild(vacio);
    return;
  }

  const totalGeneral = Object.values(totales).reduce((s,v)=>s+v,0);
  const bloque = document.createElement('div');
  bloque.className = 'cat-bloque';

  const header = document.createElement('div');
  header.className = 'cat-header abierto';
  header.innerHTML = `
    <span class="cat-emoji">${modo === 'solucionados' ? '✅' : '⚠️'}</span>
    <span class="cat-nombre" style="color:${color}">${modo === 'solucionados' ? 'Solucionados por tipo' : 'Reportados por tipo'}</span>
    <span class="cat-count" style="color:${color}">${totalGeneral}</span>
    <span class="cat-arrow">▶</span>`;

  const contIconos = document.createElement('div');
  contIconos.className = 'cat-iconos visible';

  listaTipos.forEach(tipo => {
    const total = totales[tipo] || 0;
    const pct = totalGeneral > 0 ? Math.round((total / totalGeneral) * 100) : 0;
    const emojiRiesgo = emojiDeTipoRiesgo(tipo);
    const emojiModo = modo === 'solucionados' ? '✅' : '📢';
    const item = document.createElement('div');
    item.className = 'icono-item';
    item.innerHTML = `
      <span class="icono-emoji" title="${tipo}">${emojiRiesgo}${emojiModo}</span>
      <span class="icono-label">${tipo}</span>
      <span class="icono-total">${total} <span class="icono-pct">(${pct}%)</span></span>`;
    item.addEventListener('click', () => mostrarGraficaReporte(tipo, color, modo, item));
    contIconos.appendChild(item);
  });

  header.addEventListener('click', () => {
    header.classList.toggle('abierto');
    contIconos.classList.toggle('visible');
  });

  bloque.appendChild(header);
  bloque.appendChild(contIconos);
  panel.appendChild(bloque);
}

function mostrarGraficaElemento(icono, cat, itemEl) {
  document.querySelectorAll('.icono-item').forEach(el => el.classList.remove('activo'));
  itemEl.classList.add('activo');

  const porComuna = {};
  Object.entries(DATOS_ELEMENTOS).forEach(([com, ind]) => {
    if (ind[icono.id]) porComuna[com] = ind[icono.id];
  });

  let desgloseEspec = null;
  let tituloDesglose = '';
  if (TIPOS_CON_ESPECIFICACION.includes(icono.id) && DETALLE_ESPECIFICACIONES[icono.id]) {
    desgloseEspec = DETALLE_ESPECIFICACIONES[icono.id];
    if (icono.id === 'poste_riesgo') tituloDesglose = 'Desglose por tipo de riesgo del poste';
    else if (icono.id === 'vuln_disc') tituloDesglose = 'Desglose por tipo de discapacidad registrada';
    else if (icono.id === 'cautivo') tituloDesglose = 'Desglose por descripción de animal en cautiverio';
    else if (icono.id === 'invasora') tituloDesglose = 'Desglose por especie invasora registrada';
    else tituloDesglose = 'Desglose por especificación';
  }

  renderGraficas({
    emoji: icono.emoji,
    titulo: icono.label,
    subtitulo: `${cat.nombre} · elementos en mapa · id: ${icono.id}`,
    color: cat.color,
    porComuna,
    fuente: `mapas_comunales → geometria_mapa → tipoId: "${icono.id}"`,
    desgloseEspec,
    tituloDesglose
  });
}

function mostrarGraficaReporte(tipo, color, modo, itemEl) {
  document.querySelectorAll('.icono-item').forEach(el => el.classList.remove('activo'));
  itemEl.classList.add('activo');
  tipoSeleccionadoActual = tipo;
  modoSeleccionadoActual = modo;

  const fuenteDatos = modo === 'solucionados' ? DATOS_SOLUCIONADOS : DATOS_REPORTADOS;
  const porComuna = {};
  Object.entries(fuenteDatos).forEach(([com, ind]) => {
    if (ind[tipo]) porComuna[com] = ind[tipo];
  });

  const lista = REPORTES_FULL.filter(r => {
    const t = (r.tipo_riesgo || 'Sin tipo').trim();
    if (t !== tipo) return false;
    const sol = esSolucionado(r.estado);
    return modo === 'solucionados' ? sol : !sol;
  });

  const emojiRiesgo = emojiDeTipoRiesgo(tipo);
  renderGraficas({
    emoji: emojiRiesgo + (modo === 'solucionados' ? '✅' : '📢'),
    titulo: tipo,
    subtitulo: (modo === 'solucionados' ? 'Problemas solucionados' : 'Riesgos reportados') + ' · por comuna',
    color,
    porComuna,
    fuente: `reportes_riesgos · tipo: "${tipo}" · segmento: ${modo}`,
    listaReportes: lista,
    modoLista: modo
  });
}

  // Desglose de especificaciones (postes, discapacidades, etc.)
  if (desgloseEspec && typeof desgloseEspec === 'object') {
    const rows = Object.entries(desgloseEspec).sort((a,b) => b[1]-a[1]);
    if (rows.length) {
      const totalEsp = rows.reduce((s,[,v]) => s+v, 0);
      const maxEsp = rows[0][1] || 1;
      const cardEsp = document.createElement('div');
      cardEsp.className = 'card';
      cardEsp.innerHTML = `
        <div class="card-hd">
          <div>
            <div class="card-title">${tituloDesglose || 'Desglose por especificación'}</div>
            <div class="card-sub">${totalEsp} registro(s) con detalle · ${rows.length} categoría(s)</div>
          </div>
          <span class="badge">DETALLE</span>
        </div>
        <div class="tbl-wrap" style="max-height:320px; overflow-y:auto;">
          <table>
            <thead><tr><th>#</th><th>ESPECIFICACIÓN</th><th>CANT.</th><th>%</th></tr></thead>
            <tbody id="tbody-espec"></tbody>
          </table>
        </div>`;
      panel.appendChild(cardEsp);
      const tb = cardEsp.querySelector('#tbody-espec');
      rows.forEach(([lab, cnt], i) => {
        const pct = totalEsp ? Math.round(cnt / totalEsp * 100) : 0;
        const barPct = Math.round(cnt / maxEsp * 100);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank">${String(i+1).padStart(2,'0')}</td>
          <td style="font-size:11px;font-weight:${i===0?700:500};color:#0d3d32;">
            ${lab}
            <div class="bar-mini"><div class="bar-fill" style="width:${barPct}%;background:${color}"></div></div>
          </td>
          <td class="num-bold" style="color:${color}">${cnt}</td>
          <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);">${pct}%</td>`;
        tb.appendChild(tr);
      });
    }
  }

  // Lista detallada de reportes (segmentos reportados / solucionados)
  if (listaReportes && Array.isArray(listaReportes)) {
    const cardLista = document.createElement('div');
    cardLista.className = 'card';
    cardLista.innerHTML = `
      <div class="card-hd">
        <div>
          <div class="card-title">Detalle de reportes</div>
          <div class="card-sub">${listaReportes.length} registro(s) · busca por código</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="busca-reporte-wrap" title="Buscar por código de reporte">
            <span class="lupa">🔍</span>
            <input type="text" id="input-busca-reporte" placeholder="#REP-2026-..." autocomplete="off">
          </div>
          <span class="badge">LISTA</span>
        </div>
      </div>
      <div class="lista-reportes" id="lista-reportes-detalle"></div>
      <div class="busca-sin-resultados" id="busca-sin-resultados" style="display:none;">No se encontró ningún reporte con ese código.</div>`;
    panel.appendChild(cardLista);
    const cont = cardLista.querySelector('#lista-reportes-detalle');
    const inputBusca = cardLista.querySelector('#input-busca-reporte');
    const sinRes = cardLista.querySelector('#busca-sin-resultados');
    if (!listaReportes.length) {
      cont.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:8px;">No hay reportes en esta categoría.</div>';
    } else {
      listaReportes.forEach(rep => {
        const estado = (rep.estado || 'pendiente').toLowerCase();
        let badgeCls = 'badge-pendiente';
        if (esSolucionado(estado)) badgeCls = 'badge-atendido';
        else if (estado === 'enviado') badgeCls = 'badge-enviado';
        const fecha = rep.created_at ? new Date(rep.created_at).toLocaleString('es-VE') : '—';
        const card = document.createElement('div');
        card.className = 'card-reporte';
        card.dataset.codigo = String(rep.numero_reporte || '').toLowerCase();
        card.dataset.id = String(rep.id);
        card.innerHTML = `
          <div class="card-reporte-hd">
            <div class="card-reporte-titulo">${rep.numero_reporte || '#'+rep.id} · ${rep.tipo_riesgo || 'Riesgo'}</div>
            <span class="badge-estado ${badgeCls}">${(rep.estado || 'pendiente').toUpperCase()}</span>
          </div>
          <div class="card-reporte-meta">
            📍 <b>Comuna:</b> ${rep.comuna || '—'} · <b>Sector:</b> ${rep.sector || '—'}<br>
            📌 <b>Coords:</b> ${rep.coordenadas || '—'} · <b>Urgencia:</b> ${rep.nivel_urgencia || '—'}<br>
            👤 <b>Empadronador:</b> ${rep.empadronador || 'No indicado'}<br>
            📞 <b>Teléfono:</b> ${rep.telefono || 'No indicado'}<br>
            ✉️ <b>Correo:</b> ${rep.usuario_email || '—'}<br>
            📝 <b>Ref:</b> ${rep.referencia || '—'}<br>
            📋 <b>Detalle:</b> ${rep.detalle || '—'}<br>
            📅 <b>Fecha:</b> ${fecha}
          </div>
          <div class="card-reporte-acciones" id="acc-${rep.id}"></div>`;
        cont.appendChild(card);
        const acc = card.querySelector('#acc-' + rep.id);
        if (modoLista === 'reportados' && !esSolucionado(rep.estado)) {
          const b1 = document.createElement('button');
          b1.className = 'btn-rep btn-rep-atendido';
          b1.textContent = '✅ Marcar atendido';
          b1.onclick = () => marcarReporteAtendido(rep.id);
          acc.appendChild(b1);
        }
        const b2 = document.createElement('button');
        b2.className = 'btn-rep btn-rep-eliminar';
        b2.textContent = '🗑️ Eliminar';
        b2.onclick = () => eliminarReporteCompleto(rep.id);
        acc.appendChild(b2);
      });
    }

    if (inputBusca) {
      inputBusca.addEventListener('input', () => {
        const q = inputBusca.value.trim().toLowerCase();
        const cards = cont.querySelectorAll('.card-reporte');
        let visibles = 0;
        let primerMatch = null;
        cards.forEach(c => {
          const codigo = c.dataset.codigo || '';
          const id = c.dataset.id || '';
          const q2 = q.replace(/#/g, '');
          const match = !q || codigo.includes(q) || codigo.replace(/#/g, '').includes(q2) || id.includes(q);
          c.classList.toggle('oculto-filtro', !match);
          // Resaltado amarillo estilo Ctrl+F solo cuando hay texto de búsqueda y coincide
          const resaltar = q.length > 0 && match;
          c.classList.toggle('resaltado-busca', resaltar);
          if (match) {
            visibles++;
            if (!primerMatch && resaltar) primerMatch = c;
          }
        });
        if (sinRes) sinRes.style.display = (q && visibles === 0) ? 'block' : 'none';
        if (primerMatch) {
          try { primerMatch.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
        }
      });
    }
  }

  chartBarras = new Chart(document.getElementById('cv-barras'), {
    type: 'bar',
    data: {
      labels: sorted.map(([c]) => cortar(c, 32)),
      datasets: [{
        data: sorted.map(([,v]) => v),
        backgroundColor: sorted.map(([,v]) => colorAlpha(color, 0.25 + (v/maxVal)*0.7)),
        borderColor: sorted.map(([,v]) => v===maxVal ? color : 'transparent'),
        borderWidth: sorted.map(([,v]) => v===maxVal ? 2 : 0),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: ctx => sorted[ctx[0].dataIndex][0],
          label: ctx => ` ${ctx.parsed.x} registros`
        }}
      },
      scales: {
        x: { grid:{color:'#e3e7e3'}, ticks:{color:'#5c6b63'}, border:{color:'#dde3df'} },
        y: { grid:{display:false}, ticks:{color:'#14181a',font:{size:10}}, border:{color:'#dde3df'} }
      }
    }
  });

  const coloresBase = [color, '#4ab3e8', '#e8934a', '#9b7fe8', '#e85c4a', '#74e84a', '#4ae8b0'];
  const generarColores = (num) => Array.from({length: num}, (_, i) =>
    colorAlpha(coloresBase[i % coloresBase.length], 0.7)
  );

  chartDona = new Chart(document.getElementById('cv-dona'), {
    type: 'doughnut',
    data: {
      labels: sorted.map(([c]) => cortar(c, 22)),
      datasets: [{
        data: sorted.map(([,v]) => v),
        backgroundColor: generarColores(sorted.length),
        borderColor: '#ffffff', borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '60%',
      plugins: {
        legend: { position:'bottom', labels:{color:'#14181a',padding:10,font:{size:9},boxWidth:10} },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/total*100)}%)` } }
      }
    },
    plugins: [{
      id: 'centro',
      afterDraw(chart) {
        // Usar chartArea (área real del anillo), no el canvas completo
        // para que TOTAL quede en el hueco de la dona y no abajo (donde está la leyenda)
        const { ctx, chartArea } = chart;
        if (!chartArea) return;
        const cx = (chartArea.left + chartArea.right) / 2;
        const cy = (chartArea.top + chartArea.bottom) / 2;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Número total
        ctx.fillStyle = color;
        ctx.font = '800 22px "JetBrains Mono", monospace';
        ctx.fillText(String(total), cx, cy - 8);
        // Etiqueta TOTAL
        ctx.fillStyle = '#5c6b63';
        ctx.font = '700 9px "JetBrains Mono", monospace';
        ctx.fillText('TOTAL', cx, cy + 12);
        ctx.restore();
      }
    }]
  });

  const tbody = document.getElementById('tbody-rk');
  sorted.forEach(([com, cnt], i) => {
    const pct = Math.round(cnt/maxVal*100);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${String(i+1).padStart(2,'0')}</td>
      <td style="font-size:10px;color:${i===0?'#0c0e0d':'#14181a'};font-weight:${i===0?700:400}">
        ${i===0?'🥇 ':''}${com}
        <div class="bar-mini"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      </td>
      <td class="num-bold" style="color:${color}">${cnt}</td>`;
    tbody.appendChild(tr);
  });
}

async function quitarMarcadorDelMapa(reporte) {
  /**
   * Elimina del mapa comunal:
   * 1) El ícono/marcador del riesgo reportado
   * 2) La entrada en la leyenda/historial (historialReportes)
   * Así, al abrir el mapa, ya no aparece ni el ícono ni en la leyenda.
   */
  try {
    const num = (reporte.numero_reporte || '').trim();
    const stamp = reporte.layer_stamp != null ? String(reporte.layer_stamp) : '';
    let lat = null, lng = null;
    if (reporte.coordenadas && String(reporte.coordenadas).includes(',')) {
      const parts = String(reporte.coordenadas).split(',').map(s => parseFloat(s.trim()));
      if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        lat = parts[0];
        lng = parts[1];
      }
    }

    // Cargar mapas candidatos: primero por email, luego por comuna, si no hay nada → todos (limitado)
    let mapas = [];
    const sel = 'id, geometria_mapa, usuario_email, id_comuna';

    if (reporte.usuario_email) {
      const { data, error } = await _sb.from('mapas_comunales').select(sel).eq('usuario_email', reporte.usuario_email);
      if (error) throw error;
      mapas = data || [];
    }
    if (!mapas.length && reporte.comuna) {
      const { data, error } = await _sb.from('mapas_comunales').select(sel).eq('id_comuna', reporte.comuna);
      if (error) throw error;
      mapas = data || [];
    }
    if (!mapas.length) {
      const { data, error } = await _sb.from('mapas_comunales').select(sel).limit(200);
      if (error) throw error;
      mapas = data || [];
    }

    let mapasTocados = 0;
    let featuresQuitados = 0;

    for (const mapa of mapas) {
      const geo = mapa.geometria_mapa;
      if (!geo || typeof geo !== 'object') continue;

      let cambio = false;

      // --- 1) Quitar features (íconos del mapa) ---
      if (Array.isArray(geo.features)) {
        const antes = geo.features.length;
        geo.features = geo.features.filter(f => {
          const p = f.properties || {};
          const numFeat = p.numeroReporte || p.numero_reporte || '';
          if (num && numFeat && String(numFeat) === num) {
            featuresQuitados++;
            return false; // eliminar ícono
          }
          if (lat != null && f.geometry && f.geometry.type === 'Point' && Array.isArray(f.geometry.coordinates)) {
            const [flng, flat] = f.geometry.coordinates;
            if (Math.abs(flat - lat) < 0.00025 && Math.abs(flng - lng) < 0.00025) {
              // Solo si parece un riesgo reportado
              if (p.fueReportado || numFeat || p.tipoId) {
                featuresQuitados++;
                return false;
              }
            }
          }
          return true;
        });
        if (geo.features.length !== antes) cambio = true;
      }

      // --- 2) Quitar de la leyenda / historial de reportes del mapa ---
      if (Array.isArray(geo.historialReportes)) {
        const antesH = geo.historialReportes.length;
        geo.historialReportes = geo.historialReportes.filter(h => {
          if (num && h.numeroReporte && String(h.numeroReporte) === num) return false;
          if (stamp && h.layerStamp != null && String(h.layerStamp) === stamp) return false;
          if (lat != null && h.coords && String(h.coords).includes(',')) {
            const hp = String(h.coords).split(',').map(s => parseFloat(s.trim()));
            if (hp.length >= 2 && !isNaN(hp[0]) && !isNaN(hp[1])) {
              if (Math.abs(hp[0] - lat) < 0.00025 && Math.abs(hp[1] - lng) < 0.00025) return false;
            }
          }
          return true;
        });
        if (geo.historialReportes.length !== antesH) cambio = true;
      }

      if (cambio) {
        const { error: upErr } = await _sb
          .from('mapas_comunales')
          .update({ geometria_mapa: geo })
          .eq('id', mapa.id);
        if (upErr) {
          console.warn('No se pudo actualizar mapa id=' + mapa.id, upErr.message);
          throw new Error('No se pudo actualizar el mapa: ' + upErr.message + ' (revisa política UPDATE en mapas_comunales)');
        }
        mapasTocados++;
      }
    }

    return { ok: true, mapasTocados, featuresQuitados };
  } catch (e) {
    console.error(e);
    return { ok: false, msg: e.message };
  }
}

async function marcarReporteAtendido(id) {
  if (!confirm('¿Marcar este reporte como ATENDIDO?\n\n• Se moverá a “Problemas solucionados”\n• Se eliminará el marcador del mapa\n• Se quitará de la leyenda/historial del mapa de quien lo registró')) return;
  try {
    setStatus('Marcando como atendido y limpiando leyenda del mapa...', 'ok');
    const rep = REPORTES_FULL.find(r => r.id === id);
    const { error } = await _sb.from('reportes_riesgos').update({
      estado: 'atendido'
    }).eq('id', id);
    if (error) throw error;
    if (rep) {
      const sync = await quitarMarcadorDelMapa(rep);
      if (!sync.ok) {
        console.warn('Sincronización mapa:', sync.msg);
        alert('⚠️ Atendido en el dashboard, pero NO se pudo borrar el ícono/leyenda del mapa.\n\nMotivo: ' + (sync.msg || 'desconocido') + '\n\nEjecuta en Supabase la política UPDATE de mapas_comunales.');
      } else {
        alert('✅ Atendido.\n\n• Ícono del riesgo eliminado del mapa\n• Entrada quitada de la leyenda/historial\n• Mapas actualizados: ' + (sync.mapasTocados || 0) + '\n• Íconos quitados: ' + (sync.featuresQuitados || 0) + '\n\nEl vocero debe recargar el mapa (F5) para verlo.');
      }
    } else {
      alert('✅ Marcado como atendido.');
    }
    await cargarTodo();
    cambiarSegmento('solucionados');
  } catch (e) {
    alert('Error al marcar atendido: ' + e.message);
    setStatus('Error: ' + e.message, 'err');
  }
}

async function eliminarReporteCompleto(id) {
  if (!confirm('¿ELIMINAR este reporte de la lista?\nTambién se intentará quitar el marcador del mapa de riesgos de quien lo realizó.\nEsta acción no se puede deshacer.')) return;
  try {
    setStatus('Eliminando reporte...', 'ok');
    const rep = REPORTES_FULL.find(r => r.id === id);
    const tipoAntes = tipoSeleccionadoActual;
    const modoAntes = modoSeleccionadoActual || segmentoActivo;

    // Borrar por id (numérico) — si falla por RLS, el alert lo dirá claro
    const idNum = typeof id === 'string' ? parseInt(id, 10) : id;
    const { data: delData, error } = await _sb
      .from('reportes_riesgos')
      .delete()
      .eq('id', idNum)
      .select('id');
    if (error) throw error;
    if (!delData || delData.length === 0) {
      throw new Error('No se eliminó ninguna fila. Falta política DELETE en reportes_riesgos para el rol anon.');
    }
    // Quitar de memoria de inmediato
    REPORTES_FULL = REPORTES_FULL.filter(r => r.id !== id && r.id !== idNum);
    if (rep) {
      const sync = await quitarMarcadorDelMapa(rep);
      if (!sync.ok) console.warn('Sincronización mapa:', sync.msg);
    }

    await cargarTodo();

    // Volver al mismo segmento y, si sigue existiendo el tipo, refrescar la lista sin ese reporte
    cambiarSegmento(modoAntes === 'elementos' ? 'elementos' : (modoAntes === 'solucionados' ? 'solucionados' : 'reportados'));

    if (tipoAntes && (modoAntes === 'reportados' || modoAntes === 'solucionados')) {
      const color = modoAntes === 'solucionados' ? '#2ea86a' : '#e85c4a';
      const porComuna = {};
      const fuenteDatos = modoAntes === 'solucionados' ? DATOS_SOLUCIONADOS : DATOS_REPORTADOS;
      Object.entries(fuenteDatos).forEach(([com, ind]) => {
        if (ind[tipoAntes]) porComuna[com] = ind[tipoAntes];
      });
      const lista = REPORTES_FULL.filter(r => {
        const t = (r.tipo_riesgo || 'Sin tipo').trim();
        if (t !== tipoAntes) return false;
        const sol = esSolucionado(r.estado);
        return modoAntes === 'solucionados' ? sol : !sol;
      });
      tipoSeleccionadoActual = tipoAntes;
      modoSeleccionadoActual = modoAntes;

      if (lista.length === 0 && Object.keys(porComuna).length === 0) {
        document.getElementById('panel-grafica').innerHTML = `
          <div class="estado-vacio">
            <div class="big-emoji">🗑️</div>
            <h3>Reporte eliminado</h3>
            <p>Ya no quedan registros de este tipo en este segmento.</p>
          </div>`;
      } else {
        renderGraficas({
          emoji: emojiDeTipoRiesgo(tipoAntes) + (modoAntes === 'solucionados' ? '✅' : '📢'),
          titulo: tipoAntes,
          subtitulo: (modoAntes === 'solucionados' ? 'Problemas solucionados' : 'Riesgos reportados') + ' · por comuna',
          color,
          porComuna,
          fuente: 'reportes_riesgos · tipo: "' + tipoAntes + '" · segmento: ' + modoAntes,
          listaReportes: lista,
          modoLista: modoAntes
        });
      }
    }

    setStatus('Reporte eliminado correctamente', 'ok');
  } catch (e) {
    alert('Error al eliminar: ' + e.message + '\n\nSi dice permisos, agrega políticas DELETE en reportes_riesgos.');
    setStatus('Error: ' + e.message, 'err');
  }
}

Chart.defaults.color = '#5c6b63';
Chart.defaults.font.family = "'DM Sans', sans-serif";
Chart.defaults.font.size = 10;
